# Local sandbox for testing mysqldump <-> sosie import/export cycles without
# touching a real database. Run `docker compose up -d`, then:
#   - phpMyAdmin: http://localhost:8080 (user root / password root)
#   - MariaDB directly: mysql -h127.0.0.1 -P3306 -uroot -proot

services:
  mariadb:
    image: mariadb:11
    container_name: sosie-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: shop
      MARIADB_USER: sosie
      MARIADB_PASSWORD: sosie
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      # Project fixtures mounted read-only, handy for importing a test dump
      # from the CLI inside the container, e.g.:
      #   docker compose exec mariadb sh -c 'mysql -uroot -proot shop < /dumps/01_basic.sql'
      - ./fixtures/exemples/dumps:/dumps:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: sosie-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb
      PMA_USER: root
      PMA_PASSWORD: root
      # Test dumps are small, but the web upload limit is raised in case you
      # want to import a larger dump_clean.sql.
      UPLOAD_LIMIT: 512M
    ports:
      - "8080:80"
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  mariadb_data:
