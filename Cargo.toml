[package]
name = "sosie"
version = "0.1.0"
edition = "2024"
description = "Anonymize or pseudonymize a mysqldump dump in streaming, driven by a YAML config"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mlejeunedev/sosie/"
readme = "README.md"
keywords = ["mysql", "anonymization", "gdpr", "dump", "cli"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
hmac = "0.13.0"
indicatif = "0.18.6"
rand = "0.10.2"
rand_chacha = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
sha2 = "0.11.0"

[dev-dependencies]

