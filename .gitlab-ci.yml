stages:
  - lint
  - test
  - deploy

variables:
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"

default:
  image: rust:latest
  before_script:
    - rustup component add rustfmt clippy
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .cargo/
      - target/

fmt:
  stage: lint
  script:
    - cargo fmt --check

clippy:
  stage: lint
  script:
    - cargo clippy --all-targets -- -D warnings

test:
  stage: test
  script:
    - cargo test

# Déploie docs/landing sur GitLab Pages (https://<namespace>.gitlab.io/sosie).
# Le job doit s'appeler `pages` et publier un dossier `public/` en artefact.
pages:
  stage: deploy
  image: alpine:latest
  before_script: []
  cache: []
  script:
    - rm -rf public
    - cp -r docs/landing public
  artifacts:
    paths:
      - public
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
