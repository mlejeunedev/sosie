# Complete config for fixtures/exemples/dumps/01_basic.sql
# `sosie check` must pass with this file (empty review section).

version: 1

source:
  kind: mysql

mode: anonymize

defaults:
  locale: fr_FR
  on_unclassified: fail

tables:
  user:
    email: email
    first_name: first_name
    last_name: last_name
    phone: phone
    birth_date: { preset: date_shift, days: 365 }
    password: constant("$2y$13$DEVONLYDEVONLYDEVONLYDEVONLYDEVONLYDEVONLYDEVONLYDEVO")
    api_token: null
    nickname: null           # decided by hand: too ambiguous, empty it
    roles: keep

  address:
    line1: address_line
    line2: null
    city: city
    postcode: { preset: postcode, keep_department: true }
    country: keep

  order:
    customer_email: email    # same preset as user.email → consistent
    notes: null              # free text containing PII (see row 1)
    amount: keep
    reference: keep

  bank_account:
    iban: iban
    bic: bic
    holder_name: full_name

  product:
    name: keep               # product name, not a person; explicit to silence the scan

skip_tables:
  - audit_log                # structure kept, zero rows

review: []
