# Config complète pour examples/dumps/01_basic.sql
# `dbclone check` doit passer avec ce fichier (section review vide).

version: 1

source:
  kind: mysql

mode: anonymize

defaults:
  locale: fr_FR
  on_unclassified: fail

tables:
  user:
    email: email
    first_name: first_name
    last_name: last_name
    phone: phone
    birth_date: { preset: date_shift, days: 365 }
    password: constant("$2y$13$DEVONLYDEVONLYDEVONLYDEVONLYDEVONLYDEVONLYDEVONLYDEVO")
    api_token: null
    nickname: null           # tranché à la main : trop ambigu, on vide
    roles: keep

  address:
    line1: address_line
    line2: null
    city: city
    postcode: { preset: postcode, keep_department: true }
    country: keep

  order:
    customer_email: email    # même preset que user.email → cohérent
    notes: null              # texte libre contenant une PII (voir ligne 1)
    amount: keep
    reference: keep

  bank_account:
    iban: iban
    bic: bic
    holder_name: full_name

  product:
    name: keep               # nom de produit, pas de personne ; explicite pour faire taire le scan

skip_tables:
  - audit_log                # structure conservée, zéro ligne

review: []
