# Config for fixtures/exemples/dumps/02_parser_edge_cases.sql
# Only the `email` columns are transformed. Everything else must come out
# byte-for-byte identical (including escapes, hex, _binary, views, triggers).

version: 1

source:
  kind: mysql

mode: anonymize

defaults:
  locale: fr_FR
  on_unclassified: fail

tables:
  order:
    email: email
    key: keep
    desc: keep          # free text deliberately kept here to test the round-trip

  misc:
    email: email
    blob_col: keep
    bin_col: keep

  gen:
    email: email
    # email_domain is a GENERATED column: absent from INSERTs, it must not
    # be required by the config nor make check fail

  empty_table:
    email: email

review: []
