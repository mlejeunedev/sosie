# What `sosie init --from fixtures/exemples/dumps/01_basic.sql` MUST generate
# (without --doctrine). Comments give the triggering signal.
# Exact score values may change; what is tested:
#   - every column below is present, with this preset
#   - the review section contains exactly these entries
#   - no other column appears

version: 1

source:
  kind: mysql

mode: anonymize

defaults:
  locale: fr_FR
  on_unclassified: fail

tables:
  user:
    email: email                     # name + content (5/5 emails)
    first_name: first_name           # name
    last_name: last_name             # name
    phone: phone                     # name + content (3/3 phones)
    birth_date: { preset: date_shift, days: 365 }   # name (birth)
    password: constant("$2y$13$DEVONLYDEVONLYDEVONLYDEVONLYDEVONLYDEVONLYDEVONLYDEVO")  # name (password)
    api_token: null                  # name (token)

  address:
    line1: address_line              # name (line1) in an "address" table
    line2: null                      # name (line2) — nullable → null
    city: city                       # name
    postcode: postcode               # name

  order:
    customer_email: email            # name + content (4/4 emails)

  bank_account:
    iban: iban                       # name + content (2/2 IBAN mod 97 OK)
    bic: bic                         # name
    holder_name: full_name           # name (holder + name)

  audit_log:
    ip_address: ip                   # name + content (2/2 IP)

review:
  - user.nickname                    # generic name + varchar(50): maybe an identifying handle
  - order.notes                      # free text, contains a phone number in 1/3 of the values
  - audit_log.payload                # JSON containing an "email" key
  - product.name                     # "name" outside a person context: medium score, to decide
